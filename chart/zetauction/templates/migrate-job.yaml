{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "zetauction.fullname" . }}-migrate
  labels:
    {{- include "zetauction.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "zetauction.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "zetauction.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "zetauction.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--migrate-only"]
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: {{ include "zetauction.secretName" . }}
                  key: database-connection
            - name: ConnectionStrings__Redis
              valueFrom:
                secretKeyRef:
                  name: {{ include "zetauction.secretName" . }}
                  key: redis-connection
            - name: Jwt__Issuer
              value: {{ .Values.config.jwt.issuer | quote }}
            - name: Jwt__Audience
              value: {{ .Values.config.jwt.audience | quote }}
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "zetauction.secretName" . }}
                  key: jwt-secret
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
{{- end }}
